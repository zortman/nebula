<script>
  (function () {
    const allowedHost = window.location.hostname;

    function isExternal(url) {
      try {
        const target = new URL(url, window.location.href);
        return target.hostname && target.hostname !== allowedHost;
      } catch (e) {
        return false;
      }
    }

    // 1. Block window.location.replace() and window.location.assign()
    const origReplace = window.location.replace.bind(window.location);
    window.location.replace = function (url) {
      if (isExternal(url)) return;
      origReplace(url);
    };

    const origAssign = window.location.assign.bind(window.location);
    window.location.assign = function (url) {
      if (isExternal(url)) return;
      origAssign(url);
    };

    // 2. Intercept beforeunload / external navigation attempts
    window.addEventListener("beforeunload", function (e) {
      if (document.activeElement && document.activeElement.tagName !== "A") {
        e.preventDefault();
        e.returnValue = "";
      }
    });
  })();
</script>
